name: Lint

on:
  push:
    paths:
      - "**.js"
      - "**.php"
      - "**.md"
      - "**.html"
      - "**.dart"
  pull_request:
    paths:
      - "**.js"
      - "**.php"
      - "**.md"
      - "**.html"
      - "**.dart"

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - run: npm install --no-audit --no-fund
      - run: |
          if find . -name '*.js' -not -path './node_modules/*' | grep -q .; then
            npm run lint:js
          else
            echo "Nenhum arquivo .js para lintar"
          fi

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: php-cs-fixer
      - run: |
          if find . -name '*.php' -not -path './node_modules/*' | grep -q .; then
            php-cs-fixer fix --dry-run --diff
          else
            echo "Nenhum arquivo .php para lintar"
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - run: npm install --no-audit --no-fund
      - run: npm run lint:md

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - run: npm install --no-audit --no-fund
      - run: npm run lint:html

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: |
          if find . -name '*.dart' | grep -q .; then
            dart analyze dmi-desenvolvimento-para-dispositivos-moveis-i/atividades/03-pratica-dart dmi-desenvolvimento-para-dispositivos-moveis-i/atividades/04-beecrowd
            dart format --output=none --set-exit-if-changed dmi-desenvolvimento-para-dispositivos-moveis-i/atividades
          else
            echo "Nenhum arquivo .dart para lintar"
          fi